 generic_initiate_primary_sector_5_year_plan: "Initiate Primary Sector Focused Yearly Plan"
 generic_initiate_primary_sector_5_year_plan_desc: "The primary sector covers agriculture and resource extraction, supplying food and raw materials to our population and industry. Increasing output here requires matching investment in the transport infrastructure that moves these goods to market."
 generic_initiate_secondary_sector_5_year_plan: "Initiate Secondary Sector Focused Yearly Plan"
 generic_initiate_secondary_sector_5_year_plan_desc: "The secondary sector covers manufacturing and heavy industry. It accounts for the bulk of our industrial output, and expanding its capacity is the most direct way to raise production."
 generic_initiate_tertiary_sector_5_year_plan: "Initiate Tertiary Sector Focused Yearly Plan"
 generic_initiate_tertiary_sector_5_year_plan_desc: "The tertiary sector covers services, engineering and administration. It contributes less to direct industrial output, but a modern economy depends on it. Neglecting it would leave us at a disadvantage against more developed economies."
 generic_initiate_infrastructure_5_year_plan: "Initiate Infrastructure Focused Yearly Plan"
 generic_initiate_infrastructure_5_year_plan_desc: "Our road and rail networks are in poor condition, limiting the movement of goods, workers and military supplies. Targeted investment in infrastructure will improve the efficiency of both the civilian and military economy."
 generic_initiate_military_5_year_plan: "Initiate Military Industry Focused Yearly Plan"
 generic_initiate_military_5_year_plan_desc: "Conflict with hostile powers is a realistic possibility. Directing industrial capacity toward military production will improve our readiness and equipment output."
 generic_initiate_naval_5_year_plan: "Initiate Navy Focused Yearly Plan"
 generic_initiate_naval_5_year_plan_desc: "Maintaining contact with friendly nations overseas requires a capable navy. Investment in shipyards and fleet capacity will secure our sea lanes and extend our reach."
 generic_initiate_technology_5_year_plan: "Initiate Technological Progress Focused Yearly Plan"
 generic_initiate_technology_5_year_plan_desc: "Our current equipment will not hold up against more advanced adversaries. Increased funding for research and development will accelerate technological progress across all branches of the armed forces."
 generic_initiate_energy_5_year_plan: "Initiate Energy Focused Yearly Plan"
 generic_initiate_energy_5_year_plan_desc: "Industrial expansion depends on a reliable energy supply. Increasing generation capacity now will prevent shortages as demand grows."
 generic_admit_5_year_plan_failure: "Admit the Failure of the Yearly Plan"
 generic_admit_5_year_plan_failure_desc: "The targets set in the yearly plan have proven unrealistic. Revising them will be unpopular within the party and cost us some credibility abroad, and it will take a little while before things settle back to normal. Still, correcting course now is better than pursuing targets we cannot reach."